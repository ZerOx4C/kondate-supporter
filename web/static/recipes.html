<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>レシピ - kondate-supporter</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
</head>
<body>
  <header>
    <h1>kondate-supporter</h1>
    <div class="date-range-row">
      <fieldset class="inline-form date-range" aria-label="検討期間">
        <i class="ti ti-calendar-week" aria-hidden="true"></i>
        <button type="button" id="range-shift-prev" class="icon-button range-shift-button" aria-label="前の期間へ移動">
          <i class="ti ti-chevron-left" aria-hidden="true"></i>
        </button>
        <button type="button" id="range-shift-next" class="icon-button range-shift-button" aria-label="次の期間へ移動">
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
        </button>
        <span class="date-from-wrap">
          <input type="date" id="range-from" aria-label="開始日" tabindex="-1">
          <button type="button" id="range-from-display" class="date-from-display" aria-label="開始日を変更"></button>
        </span>
        <span>から</span>
        <input type="number" id="range-days" aria-label="日数" min="1" step="1">
        <span>日間</span>
      </fieldset>
      <button type="button" id="summary-toggle" class="summary-toggle-button" aria-label="材料集計を表示">
        <i class="ti ti-report-search" aria-hidden="true"></i>
      </button>
    </div>
    <nav>
      <ul>
        <li><a href="/stocks.html">在庫</a></li>
        <li><a href="/recipes.html" aria-current="page">レシピ</a></li>
        <li><a href="/plans.html">献立</a></li>
        <li><a href="/shoppinglist.html">買い物リスト</a></li>
        <li><a href="/admin.html">管理</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>レシピ</h2>

    <div class="field-row recipe-toolbar">
      <div class="search-field">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="recipe-search-field" placeholder="レシピ名で検索" autocomplete="off" aria-label="レシピ名で検索">
        <button type="button" id="recipe-search-clear" class="icon-button" aria-label="検索をクリア">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="filter-field" id="recipe-ingredient-filter-open" aria-label="含める食材で絞り込む">
        <i class="ti ti-carrot" aria-hidden="true"></i>
        <div id="recipe-selected-ingredients" class="filter-field-chips"></div>
        <button type="button" id="recipe-ingredient-filter-clear" class="icon-button" aria-label="絞り込みをクリア">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div id="recipe-list" class="recipe-list"></div>
    <p class="error" id="recipe-list-error"></p>

    <dialog id="recipe-dialog" class="app-dialog recipe-dialog fullscreen-dialog">
      <div class="recipe-dialog-head">
        <div class="dialog-head-title-row">
          <h3 id="recipe-dialog-title"></h3>
          <button type="button" id="recipe-view-edit" class="icon-button" aria-label="編集">
            <i class="ti ti-pencil" aria-hidden="true"></i>
          </button>
        </div>
        <p id="recipe-view-servings" class="dialog-servings" hidden>
          <i class="ti ti-users" aria-hidden="true"></i><span></span>
        </p>
        <div id="recipe-name-row" class="recipe-name-row" hidden>
          <input type="text" id="recipe-name" class="recipe-name-title" form="recipe-form" placeholder="レシピ名" required>
          <label class="icon-field">
            <i class="ti ti-users" aria-hidden="true"></i>
            <input type="number" id="recipe-servings" class="text-input" form="recipe-form" min="1" step="1" required aria-label="人数">
          </label>
        </div>
      </div>
      <div class="recipe-dialog-body">
        <p class="error" id="recipe-error"></p>

        <div id="recipe-view-fields">
          <img id="recipe-view-image" class="recipe-view-image" hidden>
          <div id="recipe-view-image-placeholder" class="recipe-view-image-placeholder" hidden>
            <i class="ti ti-photo-off" aria-hidden="true"></i>
            <span>画像なし</span>
          </div>
          <p id="recipe-view-url" class="recipe-view-url"></p>
          <h4 class="section-title"><span class="icon"><i class="ti ti-carrot" aria-hidden="true"></i></span>食材</h4>
          <ul id="recipe-view-ingredients" class="material-list"></ul>
          <h4 class="section-title"><span class="icon"><i class="ti ti-salt" aria-hidden="true"></i></span>調味料</h4>
          <ul id="recipe-view-seasonings" class="material-list"></ul>
          <h4 class="section-title"><span class="icon"><i class="ti ti-list-numbers" aria-hidden="true"></i></span>手順</h4>
          <ol id="recipe-view-steps"></ol>
          <p id="recipe-view-steps-empty" hidden>手順は登録されていません。</p>
        </div>

        <form id="recipe-form">
          <input type="hidden" id="recipe-id">
          <div class="field-row">
            <label class="icon-field">
              <i class="ti ti-link" aria-hidden="true"></i>
              <input type="url" id="recipe-url" class="text-input" placeholder="https://..." aria-label="参考URL">
            </label>
          </div>
          <div class="field-row">
            <label class="image-dropzone" id="recipe-image-dropzone">
              <input type="file" id="recipe-image-input" accept="image/*" class="visually-hidden-input">
              <img id="recipe-image-preview" class="recipe-image-preview" hidden>
              <span id="recipe-image-placeholder" class="image-dropzone-placeholder">
                <i class="ti ti-photo-plus" aria-hidden="true"></i>
                <span>画像をドラッグ&amp;ドロップ<br>クリックして選択、またはコピペでも貼り付け可</span>
              </span>
            </label>
          </div>
          <div id="recipe-image-current">
            <button type="button" id="recipe-image-remove" hidden class="icon-button danger" aria-label="画像を削除">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>

          <h4 class="section-title"><span class="icon"><i class="ti ti-carrot" aria-hidden="true"></i></span>食材</h4>
          <div id="ingredient-rows"></div>
          <button type="button" id="add-ingredient-row" class="ghost-add"><i class="ti ti-plus" aria-hidden="true"></i>食材を追加</button>

          <h4 class="section-title"><span class="icon"><i class="ti ti-salt" aria-hidden="true"></i></span>調味料</h4>
          <div id="seasoning-rows"></div>
          <button type="button" id="add-seasoning-row" class="ghost-add"><i class="ti ti-plus" aria-hidden="true"></i>調味料を追加</button>

          <h4 class="section-title"><span class="icon"><i class="ti ti-list-numbers" aria-hidden="true"></i></span>手順</h4>
          <div id="step-rows"></div>
          <button type="button" id="add-step-row" class="ghost-add"><i class="ti ti-plus" aria-hidden="true"></i>手順を追加</button>
        </form>
      </div>
      <div class="recipe-dialog-foot">
        <div id="recipe-view-actions" class="dialog-actions dialog-nav-row">
          <button type="button" id="recipe-view-prev" class="primary dialog-nav-button" aria-label="前のレシピ">
            <i class="ti ti-chevron-left" aria-hidden="true"></i>
          </button>
          <button type="button" id="recipe-view-close" class="primary dialog-nav-button" aria-label="閉じる">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
          <button type="button" id="recipe-view-next" class="primary dialog-nav-button" aria-label="次のレシピ">
            <i class="ti ti-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
        <div id="recipe-edit-actions" class="dialog-actions" hidden>
          <button type="button" id="recipe-view-delete" class="danger btn-danger-outline">削除</button>
          <button type="button" id="recipe-dialog-cancel" class="primary">キャンセル</button>
          <button type="submit" form="recipe-form" id="recipe-submit" class="btn-accent">保存</button>
        </div>
      </div>
    </dialog>

    <dialog id="recipe-ingredient-filter-dialog" class="app-dialog ingredient-filter-dialog">
      <div class="search-field">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="recipe-ingredient-search-field" placeholder="食材名で検索" autocomplete="off" aria-label="食材名で検索">
        <button type="button" id="recipe-ingredient-search-clear" class="icon-button" aria-label="検索をクリア">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <div id="recipe-ingredient-filter-list" class="ingredient-filter-list"></div>
      <div class="dialog-actions">
        <button type="button" id="recipe-ingredient-filter-close" class="primary">決定</button>
      </div>
    </dialog>

    <dialog id="material-picker-dialog" class="app-dialog ingredient-filter-dialog">
      <div class="search-field">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="material-picker-search-field" placeholder="名前で検索" autocomplete="off" aria-label="名前で検索">
        <button type="button" id="material-picker-search-clear" class="icon-button" aria-label="検索をクリア">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <div id="material-picker-list" class="ingredient-filter-list"></div>
    </dialog>

    <dialog id="material-create-dialog" class="app-dialog material-create-dialog">
      <h3 id="material-create-dialog-title"></h3>
      <form id="material-create-form">
        <div class="field-row">
          <label class="icon-field">
            <i class="ti ti-carrot" aria-hidden="true" id="material-create-name-icon"></i>
            <input type="text" id="material-create-name" class="text-input" placeholder="名前" aria-label="名前" required>
          </label>
          <label id="material-create-unit-label" hidden>
            <input type="text" id="material-create-unit" class="text-input" placeholder="単位" aria-label="単位">
          </label>
          <label id="material-create-spoon-label" class="icon-field" hidden>
            <input type="checkbox" id="material-create-spoon-display" checked>
            さじ表記
          </label>
        </div>
        <p class="error" id="material-create-error"></p>
        <div class="dialog-actions">
          <button type="button" id="material-create-cancel-button" class="primary">キャンセル</button>
          <button type="submit" id="material-create-submit-button" class="btn-accent">追加</button>
        </div>
      </form>
    </dialog>
  </main>

  <dialog id="summary-dialog" class="app-dialog summary-dialog">
    <h3>材料集計</h3>
    <p>表示期間の献立に必要な食材と、在庫からの残りを表示します。</p>
    <table id="summary-table">
      <thead>
        <tr>
          <th>名前</th>
          <th>必要量</th>
          <th>残り</th>
        </tr>
      </thead>
      <tbody id="summary-list"></tbody>
    </table>
    <p id="summary-empty" hidden>表示できる食材がありません。</p>
    <p class="error" id="summary-error"></p>
    <div class="dialog-actions">
      <button type="button" id="summary-dialog-close" class="primary">閉じる</button>
    </div>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/daterange.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/materialCreateDialog.js"></script>
  <script src="/js/summary.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/seasoningFormat.js"></script>
  <script src="/js/recipes.js"></script>
</body>
</html>
