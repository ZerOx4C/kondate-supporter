<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシピ - kondate-supporter</title>
<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="base.css">
<style>
#recipe-list { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; }
#recipe-list li { min-width: 0; position: relative; }
.tile-bookmark { position: absolute; top: 0.3rem; left: 0.3rem; }
#recipe-list .tile-bookmark[aria-pressed="true"] { background: #e7f0fa; border-color: #1a5fb4; }
.tile { display: block; color: inherit; text-decoration: none; }
.tile-visual { position: relative; aspect-ratio: 1 / 1; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
.tile-image { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; background: #eee; color: #bbb; }
.tile-placeholder .ti { font-size: 3rem; }
.tile-footer { position: absolute; left: 0; right: 0; bottom: 0; }
.tile-tags { display: flex; flex-wrap: nowrap; gap: 0.2rem; overflow: hidden; margin: 0; padding: 0 0.3rem 0.3rem; list-style: none; }
.tile-tags .tag { display: block; flex-shrink: 0; font-size: 0.7rem; padding: 0 0.3rem; background: rgba(255, 255, 255, 0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-tags .tag.shrink { flex-shrink: 1; min-width: 0; }
.tile-name { display: block; padding: 0.3rem 0.5rem; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-cooked { position: absolute; top: 0.3rem; right: 0.3rem; padding: 0.1rem 0.4rem; border-radius: 1rem; background: rgba(255, 255, 255, 0.85); font-size: 0.9rem; line-height: 1rem; }
.tile-cooked .ti { font-size: 1rem; }
.tile-add .tile-visual { border: 1px dashed #999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem; color: #555; }
.tile-add .ti { font-size: 2.5rem; }
.tile-add-label { font-size: 0.9rem; }
@media (hover: hover) { .tile-add:hover .tile-visual { background: #f0f0f0; } }
.tile-add:active .tile-visual { background: #f0f0f0; }
.cooked { display: inline-flex; align-items: center; gap: 0.2rem; }
.search-box { position: relative; margin-top: 1rem; }
#name-search { padding-right: 44px; }
#name-search-clear { position: absolute; top: 0; right: 0; height: 100%; border: none; background: transparent; }
.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
#bookmark-filter-button[aria-pressed="true"] { background: #e7f0fa; border-color: #1a5fb4; }
#selected-tags:empty { display: none; }
#sort-select { margin-left: auto; }
#filter-empty { margin: 1rem 0 0; color: #555; }
.dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.dialog-header h2 { margin: 0; font-size: 1.1rem; }
#tag-options { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 0; padding: 0; }
#tag-options button { max-width: 100%; overflow-wrap: anywhere; }
#tag-options button[aria-pressed="true"] { background: #e7f0fa; border-color: #1a5fb4; color: #1a5fb4; }
#tag-options-empty { margin: 1rem 0 0; color: #555; }
</style>
</head>
<body>
<header>
  <h1>レシピ</h1>
  <a class="button icon-only" href="import.html" aria-label="レシピを取り込む" title="レシピを取り込む"><i class="ti ti-file-import" aria-hidden="true"></i></a>
</header>
<main>
  <div id="search-box" class="search-box" hidden>
    <input id="name-search" type="text" autocomplete="off" enterkeyhint="search" placeholder="名前で探す" aria-label="名前で探す">
    <button type="button" id="name-search-clear" class="icon-only" aria-label="キーワードを消す" title="キーワードを消す" hidden><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>
  <div id="filter-bar" class="filter-bar" hidden>
    <button type="button" id="bookmark-filter-button" class="icon-only" aria-pressed="false" aria-label="ブックマークで絞り込む" title="ブックマークで絞り込む"><i class="ti ti-bookmark" aria-hidden="true"></i></button>
    <button type="button" id="tag-filter-button"><i class="ti ti-filter" aria-hidden="true"></i>タグ</button>
    <ul id="selected-tags" class="tags removable"></ul>
    <select id="sort-select" aria-label="並び順">
      <option value="new">新着順</option>
      <option value="name">名前順</option>
      <option value="cooked-desc">作った回数が多い順</option>
      <option value="cooked-asc">作った回数が少ない順</option>
    </select>
  </div>
  <p class="error" id="list-error"></p>
  <ul id="recipe-list"></ul>
  <p id="filter-empty" hidden>条件に合うレシピがありません</p>
</main>

<button type="button" id="scroll-top-button" class="icon-only scroll-top" aria-label="先頭へ戻る" title="先頭へ戻る" hidden><i class="ti ti-arrow-up" aria-hidden="true"></i></button>

<dialog id="tag-dialog" aria-labelledby="tag-dialog-title">
  <div class="dialog-inner">
    <div class="dialog-header">
      <h2 id="tag-dialog-title">タグで絞り込む</h2>
      <button type="button" id="tag-dialog-close" class="icon-only" aria-label="閉じる" title="閉じる" autofocus><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <input id="tag-search" type="text" autocomplete="off" placeholder="タグを探す" aria-label="タグを探す">
    <ul id="tag-options"></ul>
    <p id="tag-options-empty" hidden></p>
  </div>
</dialog>

<script src="common.js"></script>
<script src="recipes.js"></script>
</body>
</html>
