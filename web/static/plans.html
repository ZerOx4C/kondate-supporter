<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>献立 - kondate-supporter</title>
<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="dev-mode.css">
<style>
  .period { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
  .period-options { display: flex; justify-content: space-between; align-items: center; }
  #meal-toggle button[aria-pressed="true"] { background: #e7f0fa; color: #1a5fb4; }
  /* 時間帯がオフの帯は出さない。親の属性に空白区切りで持つので、期間を変えて帯を作り直しても残る */
  #day-areas[data-hidden-meals~="breakfast"] .plan-meal[data-meal="breakfast"],
  #day-areas[data-hidden-meals~="lunch"] .plan-meal[data-meal="lunch"],
  #day-areas[data-hidden-meals~="dinner"] .plan-meal[data-meal="dinner"] { display: none; }
  #day-areas[data-hidden-meals~="breakfast"][data-hidden-meals~="lunch"][data-hidden-meals~="dinner"] .plan-day { display: none; }
  /* オフの時間帯の件数。0件は薄く、1件以上は隠れた帯にパネルがあるので赤で出す */
  #day-areas[data-hidden-meals~="breakfast"] .plan-day-count[data-meal="breakfast"].plan-day-count-zero,
  #day-areas[data-hidden-meals~="lunch"] .plan-day-count[data-meal="lunch"].plan-day-count-zero,
  #day-areas[data-hidden-meals~="dinner"] .plan-day-count[data-meal="dinner"].plan-day-count-zero { opacity: 0.35; }
  #day-areas[data-hidden-meals~="breakfast"] .plan-day-count[data-meal="breakfast"]:not(.plan-day-count-zero),
  #day-areas[data-hidden-meals~="lunch"] .plan-day-count[data-meal="lunch"]:not(.plan-day-count-zero),
  #day-areas[data-hidden-meals~="dinner"] .plan-day-count[data-meal="dinner"]:not(.plan-day-count-zero) { color: #c00; }
  .plan-area h2 { margin: 1.5rem 0 0.5rem; font-size: 1.1rem; }
  .plan-area-heading { display: flex; align-items: center; }
  #memo-add { margin-left: auto; }
  #memo-dialog-title { margin: 0 0 0.5rem; font-size: 1.1rem; }
  #memo-input { width: 100%; box-sizing: border-box; margin-bottom: 1rem; }
  .plan-area-toggle { width: 100%; justify-content: flex-start; gap: 0.5rem; padding: 0 0.5rem; font: inherit; color: inherit; background: transparent; border: none; }
  #day-areas .plan-area-toggle[aria-current="date"] { background: #eef8df; }
  .plan-day-counts { margin-left: auto; display: flex; gap: 0.75rem; font-weight: normal; }
  .plan-day-count { display: inline-flex; align-items: center; gap: 0.2rem; }
  .plan-list { list-style: none; margin: 0; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; min-height: 3rem; border: 1px solid #ccc; border-radius: 8px; }
  .plan-panel { display: flex; align-items: center; background: #fff; border: 1px solid #999; border-radius: 8px; }
  .plan-grip { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; color: #999; }
  .plan-panel-link, .plan-panel-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0 0.5rem 0 0; color: inherit; text-decoration: none; border-radius: 0; }
  .plan-panel-body { font: inherit; text-align: left; justify-content: flex-start; background: transparent; border: none; }
  .plan-remove { flex: none; border: none; border-radius: 0 8px 8px 0; background: transparent; }
  .plan-panel-link:active, .plan-panel-body:active { background: #f0f0f0; }
  @media (hover: hover) {
    .plan-panel-link:hover, .plan-panel-body:hover { background: #f0f0f0; }
  }
  .plan-thumb { width: 44px; height: 44px; flex: none; object-fit: cover; }
  .plan-thumb-placeholder { display: flex; align-items: center; justify-content: center; background: #eee; color: #999; }
  .plan-servings { flex: none; display: inline-flex; align-items: center; gap: 0.2rem; padding: 0 0.5rem; font: inherit; border: none; border-radius: 0; background: transparent; }
  .plan-panel .plan-servings.changed { color: #1e6b2e; background: #e3f4e3; }
  #servings-dialog-title { margin: 0 0 0.5rem; font-size: 1.1rem; }
  #servings-recipe { margin: 0 0 0.5rem; }
  .servings-stepper { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
  #servings-input { width: 4rem; text-align: center; }
  .plan-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-grip { touch-action: none; cursor: grab; }
  .plan-panel.plan-dragging { opacity: 0.4; }
  .plan-panel, .plan-list { position: relative; }
  .plan-ghost { position: fixed; margin: 0; z-index: 10; pointer-events: none; list-style: none; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
  .plan-day { border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
  .plan-meal { border: none; border-radius: 0; }
  .plan-meal[data-meal="breakfast"] { background: #e7f1f8; }
  .plan-meal[data-meal="lunch"] { background: #fff1db; }
  .plan-meal[data-meal="dinner"] { background: #efe6ee; }
  .plan-meal[data-meal="breakfast"] > .plan-panel { border-color: #5995c0; }
  .plan-meal[data-meal="lunch"] > .plan-panel { border-color: #d99426; }
  .plan-meal[data-meal="dinner"] > .plan-panel { border-color: #af6aa7; }
  /* 空の帯・空の毎日・空の候補の背景のアイコン。文字コードは同梱の tabler-icons.min.css の ti-haze / ti-sun-high / ti-moon / ti-calendar-plus の値を写したもの */
  .plan-meal:empty::before, #daily-list:empty::before, #candidates:empty::before { margin: auto; font-family: "tabler-icons"; font-size: 2rem; line-height: 1; color: rgba(0, 0, 0, 0.15); pointer-events: none; }
  .plan-meal[data-meal="breakfast"]:empty::before { content: "\efaa"; content: "\efaa" / ""; }
  .plan-meal[data-meal="lunch"]:empty::before { content: "\f236"; content: "\f236" / ""; }
  .plan-meal[data-meal="dinner"]:empty::before { content: "\eaf8"; content: "\eaf8" / ""; }
  #daily-list:empty::before { content: "\efaa\2002\f236\2002\eaf8"; content: "\efaa\2002\f236\2002\eaf8" / ""; white-space: nowrap; }
  #candidates:empty::before { content: "\ebba"; content: "\ebba" / ""; }
  .plan-list:not(.plan-meal).drop-target { background: #e8f1ff; border-color: #3b82f6; }
  .plan-meal.drop-target { box-shadow: inset 0 0 0 2px #3b82f6; }
  .plan-panel.drop-before::before, .plan-list.drop-end::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: #3b82f6; }
  .plan-panel.drop-before::before { top: -6px; }
  .plan-list.drop-end::after { bottom: -6px; }
  .plan-meal.drop-end::after { bottom: 2px; }
  .plan-meal.drop-end:empty::after { top: 2px; bottom: auto; }
</style>
</head>
<body>
<header>
  <h1>献立</h1>
  <div class="actions">
    <nav id="page-nav" class="button-group page-nav" aria-label="画面の切り替え">
      <a class="button icon-only" href="recipes.html" aria-label="レシピ" title="レシピ"><i class="ti ti-book-2" aria-hidden="true"></i></a>
      <a class="button icon-only" href="plans.html" aria-current="page" aria-label="献立" title="献立"><i class="ti ti-calendar-week" aria-hidden="true"></i></a>
      <a class="button icon-only" href="summary.html" aria-label="集計" title="集計"><i class="ti ti-receipt" aria-hidden="true"></i></a>
    </nav>
    <button type="button" id="menu-button" class="icon-only" aria-label="メニュー" title="メニュー"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
  </div>
</header>

<dialog id="main-menu" class="menu" aria-label="メニュー"><ul><li><a class="button" id="import-link" href="import.html">レシピを取り込む</a></li></ul></dialog>

<dialog id="memo-dialog" aria-labelledby="memo-dialog-title">
  <form id="memo-form" class="dialog-inner">
    <h2 id="memo-dialog-title">メモを追加</h2>
    <p class="error" id="memo-error"></p>
    <input type="text" id="memo-input" placeholder="メモ" aria-label="メモ" autocomplete="off" enterkeyhint="done">
    <div class="actions">
      <button type="submit" id="memo-save" class="primary"><i class="ti ti-device-floppy" aria-hidden="true"></i>保存</button>
      <button type="button" id="memo-cancel">キャンセル</button>
    </div>
  </form>
</dialog>

<dialog id="servings-dialog" aria-labelledby="servings-dialog-title">
  <form id="servings-form" class="dialog-inner">
    <h2 id="servings-dialog-title">献立の人数</h2>
    <p id="servings-recipe"></p>
    <p class="error" id="servings-error"></p>
    <div class="servings-stepper">
      <button type="button" id="servings-minus" class="icon-only" aria-label="1人減らす" title="1人減らす"><i class="ti ti-minus" aria-hidden="true"></i></button>
      <input type="text" id="servings-input" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="人数">
      <button type="button" id="servings-plus" class="icon-only" aria-label="1人増やす" title="1人増やす"><i class="ti ti-plus" aria-hidden="true"></i></button>
    </div>
    <div class="actions">
      <button type="submit" id="servings-save" class="primary"><i class="ti ti-device-floppy" aria-hidden="true"></i>保存</button>
      <button type="button" id="servings-reset">戻す</button>
      <button type="button" id="servings-cancel">キャンセル</button>
    </div>
  </form>
</dialog>

<main>
  <div class="period">
    <div id="period-range" class="period-range" role="group" aria-label="期間">
      <button type="button" class="period-prev icon-only" aria-label="前の期間" title="前の期間"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
      <span class="period-text">
        <span class="period-start-wrap">
          <button type="button" class="period-start" title="開始日を選ぶ"></button>
          <input type="date" class="period-start-input" tabindex="-1" aria-hidden="true">
        </span>
        <span>から</span>
        <button type="button" class="period-days" title="日数を変える"></button>
        <input type="number" class="period-days-input" min="1" max="31" step="1" inputmode="numeric" enterkeyhint="done" aria-label="日数" hidden>
        <span>日間</span>
      </span>
      <button type="button" class="period-next icon-only" aria-label="次の期間" title="次の期間"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    </div>
    <div class="period-options">
      <button type="button" id="collapse-all" class="icon-only" aria-label="すべて折り畳み" title="すべて折り畳み"><i class="ti ti-chevrons-up" aria-hidden="true"></i></button>
      <div id="meal-toggle" class="button-group" role="group" aria-label="表示する時間帯">
        <button type="button" class="icon-only" data-meal="breakfast" aria-pressed="true" aria-label="朝" title="朝"><i class="ti ti-haze" aria-hidden="true"></i></button>
        <button type="button" class="icon-only" data-meal="lunch" aria-pressed="true" aria-label="昼" title="昼"><i class="ti ti-sun-high" aria-hidden="true"></i></button>
        <button type="button" class="icon-only" data-meal="dinner" aria-pressed="true" aria-label="夜" title="夜"><i class="ti ti-moon" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>

  <p class="error" id="plans-error"></p>

  <section class="plan-area" id="candidates-area" aria-labelledby="candidates-title">
    <h2 class="plan-area-heading"><span id="candidates-title">候補</span><button type="button" id="memo-add" class="icon-only" aria-label="メモを追加" title="メモを追加"><i class="ti ti-note" aria-hidden="true"></i></button></h2>
    <p class="error" id="candidates-error"></p>
    <ul class="plan-list" id="candidates" data-date="" data-meal="candidate"></ul>
  </section>

  <section class="plan-area plan-target" aria-labelledby="daily-title">
    <h2><button type="button" id="daily-toggle" class="plan-area-toggle" aria-expanded="true" aria-controls="daily-list"><i class="ti ti-chevron-down" aria-hidden="true"></i><span id="daily-title">毎日</span></button></h2>
    <p class="error"></p>
    <ul class="plan-list" id="daily-list" data-date=""></ul>
  </section>

  <div id="day-areas"></div>
</main>

<script src="common.js"></script>
<script src="plans.js"></script>
</body>
</html>
