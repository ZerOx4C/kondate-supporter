<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在庫 - kondate-supporter</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
</head>
<body>
  <header>
    <h1>kondate-supporter</h1>
    <div class="date-range-row">
      <fieldset class="inline-form date-range" aria-label="検討期間">
        <i class="ti ti-calendar-week" aria-hidden="true"></i>
        <button type="button" id="range-shift-prev" class="icon-button range-shift-button" aria-label="前の期間へ移動">
          <i class="ti ti-chevron-left" aria-hidden="true"></i>
        </button>
        <button type="button" id="range-shift-next" class="icon-button range-shift-button" aria-label="次の期間へ移動">
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
        </button>
        <span class="date-from-wrap">
          <input type="date" id="range-from" aria-label="開始日" tabindex="-1">
          <button type="button" id="range-from-display" class="date-from-display" aria-label="開始日を変更"></button>
        </span>
        <span>から</span>
        <input type="number" id="range-days" aria-label="日数" min="1" step="1">
        <span>日間</span>
      </fieldset>
      <button type="button" id="summary-toggle" class="summary-toggle-button" aria-label="材料集計を表示">
        <i class="ti ti-report-search" aria-hidden="true"></i>
      </button>
    </div>
    <nav>
      <ul>
        <li><a href="/stocks.html" aria-current="page">在庫</a></li>
        <li><a href="/recipes.html">レシピ</a></li>
        <li><a href="/plans.html">献立</a></li>
        <li><a href="/shoppinglist.html">買い物リスト</a></li>
        <li><a href="/admin.html">管理</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>在庫</h2>

    <div class="search-field">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="stock-search" placeholder="食材名で検索" aria-label="食材を検索">
      <button type="button" id="stock-search-clear" class="icon-button" aria-label="検索をクリア">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
      <button type="button" id="new-ingredient-button" class="icon-button" aria-label="新規食材を追加" hidden>
        <i class="ti ti-plus" aria-hidden="true"></i>
      </button>
    </div>

    <table id="stock-table">
      <thead>
        <tr>
          <th>名前</th>
          <th>数量</th>
          <th>更新日時</th>
        </tr>
      </thead>
      <tbody id="stock-list"></tbody>
    </table>
    <p class="error" id="stock-error"></p>
  </main>

  <dialog id="material-create-dialog" class="app-dialog material-create-dialog">
    <h3 id="material-create-dialog-title"></h3>
    <form id="material-create-form">
      <div class="field-row">
        <label class="icon-field">
          <i class="ti ti-carrot" aria-hidden="true" id="material-create-name-icon"></i>
          <input type="text" id="material-create-name" class="text-input" placeholder="名前" aria-label="名前" required>
        </label>
        <label id="material-create-unit-label" hidden>
          <input type="text" id="material-create-unit" class="text-input" placeholder="単位" aria-label="単位">
        </label>
        <label id="material-create-spoon-label" class="icon-field" hidden>
          <input type="checkbox" id="material-create-spoon-display" checked>
          さじ表記
        </label>
      </div>
      <p class="error" id="material-create-error"></p>
      <div class="dialog-actions">
        <button type="button" id="material-create-cancel-button" class="primary">キャンセル</button>
        <button type="submit" id="material-create-submit-button" class="btn-accent">追加</button>
      </div>
    </form>
  </dialog>

  <dialog id="summary-dialog" class="app-dialog summary-dialog">
    <h3>材料集計</h3>
    <p>表示期間の献立に必要な食材と、在庫からの残りを表示します。</p>
    <table id="summary-table">
      <thead>
        <tr>
          <th>名前</th>
          <th>必要量</th>
          <th>残り</th>
        </tr>
      </thead>
      <tbody id="summary-list"></tbody>
    </table>
    <p id="summary-empty" hidden>表示できる食材がありません。</p>
    <p class="error" id="summary-error"></p>
    <div class="dialog-actions">
      <button type="button" id="summary-dialog-close" class="primary">閉じる</button>
    </div>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/daterange.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/materialCreateDialog.js"></script>
  <script src="/js/summary.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/stocks.js"></script>
</body>
</html>
