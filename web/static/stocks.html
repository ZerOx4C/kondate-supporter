<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在庫 - kondate-supporter</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
</head>
<body>
  <header>
    <h1>kondate-supporter</h1>
    <div class="date-range-row">
      <fieldset class="inline-form date-range" aria-label="検討期間">
        <i class="ti ti-calendar-week" aria-hidden="true"></i>
        <input type="date" id="range-from" aria-label="開始日">
        <span>～</span>
        <input type="date" id="range-to" aria-label="終了日">
      </fieldset>
      <button type="button" id="summary-toggle" class="summary-toggle-button" aria-label="材料集計を表示">
        <i class="ti ti-report-search" aria-hidden="true"></i>
      </button>
    </div>
    <nav>
      <ul>
        <li><a href="/">トップ</a></li>
        <li><a href="/masters.html">マスタ管理</a></li>
        <li><a href="/stocks.html" aria-current="page">在庫</a></li>
        <li><a href="/recipes.html">レシピ</a></li>
        <li><a href="/plans.html">献立</a></li>
        <li><a href="/shoppinglist.html">買い物リスト</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>在庫</h2>

    <div class="search-field">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="stock-search" placeholder="食材名で検索" aria-label="食材を検索">
      <button type="button" id="new-ingredient-button" class="icon-button" aria-label="新規食材を追加" hidden>
        <i class="ti ti-plus" aria-hidden="true"></i>
      </button>
    </div>

    <table id="stock-table">
      <thead>
        <tr>
          <th>名前</th>
          <th>数量</th>
          <th>更新日時</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="stock-list"></tbody>
    </table>
    <p class="error" id="stock-error"></p>
  </main>

  <dialog id="summary-dialog" class="summary-dialog">
    <h3>材料集計</h3>
    <p>表示期間の献立に必要な食材と、在庫からの残りを表示します。</p>
    <table id="summary-table">
      <thead>
        <tr>
          <th>名前</th>
          <th>必要量</th>
          <th>残り</th>
        </tr>
      </thead>
      <tbody id="summary-list"></tbody>
    </table>
    <p id="summary-empty" hidden>表示できる食材がありません。</p>
    <p class="error" id="summary-error"></p>
    <div class="dialog-actions">
      <button type="button" id="summary-dialog-close">閉じる</button>
    </div>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/daterange.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/summary.js"></script>
  <script src="/js/stocks.js"></script>
</body>
</html>
