<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシピ - kondate-supporter</title>
<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="dev-mode.css">
<style>
.cooked { display: inline-flex; align-items: center; gap: 0.2rem; }
#cooked-button[aria-pressed="true"] { background: #ffe8c2; border-color: #e0a040; }
#bookmark-button[aria-pressed="true"] { background: #e7f0fa; border-color: #1a5fb4; }
#view-name { margin: 1rem 0 0.5rem; overflow-wrap: anywhere; }
#view-name, #view-ingredients, #view-body { -webkit-user-select: text; user-select: text; }
#view-ingredients { width: 100%; border-collapse: collapse; margin: 1rem 0; }
#view-ingredients td { padding: 0.4rem 0; vertical-align: top; }
#view-ingredients td:first-child { overflow-wrap: anywhere; }
#view-ingredients td:last-child { text-align: right; padding-left: 1rem; overflow-wrap: break-word; }
#view-ingredients tr + tr td { border-top: 1px solid #ddd; }
#view-body { white-space: pre-wrap; margin: 1rem 0; }
#view-body a { overflow-wrap: anywhere; }
.recipe-image { display: block; width: 100%; height: 25vh; object-fit: cover; margin: 0.5rem 0; border-radius: 8px; }
#edit-mode { margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem; }
#edit-error { margin: 0; }
.image-preview { position: relative; }
.image-preview .recipe-image { margin: 0; }
#remove-image-button { position: absolute; right: 0.5rem; bottom: 0.5rem; }
.no-image { position: relative; height: 10rem; }
.paste-area { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding-top: 1.5rem; box-sizing: border-box; border: 1px dashed #999; border-radius: 8px; color: #666; caret-color: transparent; cursor: text; }
.paste-area small { font-size: 0.8rem; }
.paste-area:focus { outline: 2px solid #4a90e2; outline-offset: 1px; }
.no-image-actions { position: absolute; left: 0; right: 0; bottom: 1.5rem; display: flex; justify-content: center; pointer-events: none; }
.no-image-actions button { pointer-events: auto; }
#view-tags { margin-bottom: 0.5rem; }
#view-tags a.tag { text-decoration: none; }
@media (hover: hover) { #view-tags a.tag:hover { background: #e0e0e0; } }
#view-tags a.tag:active { background: #e0e0e0; }
#edit-tags:not(:empty) { margin-top: 0.5rem; }
.tag-input-row { display: flex; gap: 0.5rem; }
.tag-input-row input { flex: 1; }
.ingredient-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.ingredient-rows:not(:empty) { margin-bottom: 0.5rem; }
.ingredient-row { display: flex; gap: 0.5rem; }
.ingredient-handle { cursor: grab; touch-action: none; }
.ingredient-rows.sorting .ingredient-handle { cursor: grabbing; }
.ingredient-rows.sorting .ingredient-row:not(.dragging) { transition: transform 0.15s; }
.ingredient-row.dragging { position: relative; z-index: 1; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
@media (prefers-reduced-motion: reduce) { .ingredient-rows.sorting .ingredient-row:not(.dragging) { transition: none; } }
.ingredient-row .ingredient-name { flex: 1; min-width: 0; }
.ingredient-row .ingredient-amount { flex: 0 0 7rem; min-width: 0; }
#collect-dialog-title { margin: 0 0 0.5rem; font-size: 1.1rem; }
.collect-candidates { list-style: none; margin: 0 0 1rem; padding: 0; max-height: 50vh; overflow-y: auto; }
.collect-candidates li + li { border-top: 1px solid #ddd; }
.collect-candidates label { display: flex; align-items: center; gap: 0.5rem; min-height: 44px; cursor: pointer; }
.collect-candidates input[type="checkbox"] { width: 1.25rem; height: 1.25rem; margin: 0; flex: none; }
.collect-name { flex: 1; overflow-wrap: anywhere; }
.collect-amount { text-align: right; overflow-wrap: break-word; }
</style>
</head>
<body>
<header>
  <a id="back-link" class="button icon-only" href="recipes.html" aria-label="一覧へ戻る" title="一覧へ戻る"><i class="ti ti-arrow-left" aria-hidden="true"></i></a>
  <button type="button" id="cancel-button" hidden><i class="ti ti-arrow-back-up" aria-hidden="true"></i>キャンセル</button>
  <div id="view-actions" class="actions" hidden>
    <button type="button" id="bookmark-button" class="icon-only" aria-pressed="false" aria-label="ブックマーク" title="ブックマーク"><i class="ti ti-bookmark" aria-hidden="true"></i></button>
    <button type="button" id="cooked-button" aria-pressed="false" aria-label="作った" title="作った"></button>
    <button type="button" id="edit-button" class="icon-only" aria-label="編集" title="編集"><i class="ti ti-pencil" aria-hidden="true"></i></button>
    <button type="button" id="delete-button" class="danger"><i class="ti ti-trash" aria-hidden="true"></i>削除</button>
  </div>
  <div id="edit-actions" class="actions" hidden>
    <button type="submit" id="save-button" class="primary" form="edit-mode"><i class="ti ti-device-floppy" aria-hidden="true"></i>保存</button>
  </div>
</header>
<main>
  <p class="error" id="load-error"></p>
  <section id="view-mode" hidden>
    <p class="error" id="view-error"></p>
    <h1 id="view-name"></h1>
    <ul id="view-tags" class="tags" hidden></ul>
    <img id="view-image" class="recipe-image" alt="" hidden>
    <table id="view-ingredients" aria-label="材料" hidden><tbody></tbody></table>
    <div id="view-body"></div>
  </section>
  <form id="edit-mode" hidden>
    <p class="error" id="edit-error"></p>
    <input id="edit-name" type="text" placeholder="名前" aria-label="名前">
    <div class="tag-field">
      <div class="tag-input-row">
        <input id="tag-input" type="text" list="tag-options" enterkeyhint="enter" autocomplete="off" placeholder="タグ" aria-label="追加するタグ">
        <button type="button" id="add-tag-button"><i class="ti ti-plus" aria-hidden="true"></i>追加</button>
      </div>
      <ul id="edit-tags" class="tags removable"></ul>
      <datalist id="tag-options"></datalist>
    </div>
    <div class="image-field">
      <div id="edit-preview" class="image-preview" hidden>
        <img id="edit-image" class="recipe-image" alt="">
        <button type="button" id="remove-image-button" class="icon-only" aria-label="画像を外す" title="画像を外す"><i class="ti ti-photo-off" aria-hidden="true"></i></button>
      </div>
      <div id="edit-no-image" class="no-image">
        <div id="paste-area" class="paste-area" contenteditable="true" inputmode="none" spellcheck="false" role="textbox" aria-label="画像をここに貼り付け"><span>画像なし</span><small>Ctrl+V・長押しで貼り付け</small></div>
        <div class="no-image-actions">
          <button type="button" id="pick-image-button"><i class="ti ti-photo" aria-hidden="true"></i>画像を選ぶ</button>
        </div>
      </div>
      <input type="file" id="image-input" accept="image/*" hidden>
    </div>
    <div class="ingredient-field" role="group" aria-label="材料">
      <ul id="edit-ingredients" class="ingredient-rows"></ul>
      <div class="actions">
        <button type="button" id="add-ingredient-button"><i class="ti ti-plus" aria-hidden="true"></i>追加</button>
        <button type="button" id="collect-ingredients-button"><i class="ti ti-text-scan-2" aria-hidden="true"></i>本文から集める</button>
      </div>
    </div>
    <textarea id="edit-body" rows="15" placeholder="本文" aria-label="本文"></textarea>
  </form>
</main>

<button type="button" id="scroll-top-button" class="icon-only scroll-top" aria-label="先頭へ戻る" title="先頭へ戻る" hidden><i class="ti ti-arrow-up" aria-hidden="true"></i></button>

<dialog id="confirm-dialog">
  <div class="dialog-inner">
    <p id="confirm-message"></p>
    <div class="actions">
      <button type="button" id="confirm-ok" class="danger"></button>
      <button type="button" id="confirm-cancel">キャンセル</button>
    </div>
  </div>
</dialog>

<dialog id="collect-dialog" aria-labelledby="collect-dialog-title">
  <div class="dialog-inner">
    <h2 id="collect-dialog-title">本文から集めた材料</h2>
    <p id="collect-empty" hidden>本文に材料らしい行がありません</p>
    <ul id="collect-candidates" class="collect-candidates"></ul>
    <div class="actions">
      <button type="button" id="collect-ok"><i class="ti ti-plus" aria-hidden="true"></i>追加</button>
      <button type="button" id="collect-cancel">キャンセル</button>
    </div>
  </div>
</dialog>

<script src="common.js"></script>
<script src="recipe.js"></script>
</body>
</html>
